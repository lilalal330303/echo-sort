<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff0cd">
  <link rel="icon" href="play.icon.png">
  <meta name="description" content="开饭啦！双拼厨房：一盘两份，三同出餐。六家卡通小店，60关双台接力；免费重试，进度自动保存。">
  <title>开饭啦！双拼厨房 · BENTO POP — 在线试玩</title>
  <style>
    :root{color-scheme:light;--cream:#fff0cd;--ink:#55301f;--quiet:#886249;--coral:#bd3f2b}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}
    body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:var(--cream);color:var(--ink);overflow:hidden}
    body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(90deg,#efb17b18 0 55px,transparent 55px 110px),repeating-linear-gradient(#efb17b18 0 55px,transparent 55px 110px);pointer-events:none}
    main{position:relative;display:flex;gap:64px;justify-content:center;align-items:center;min-height:100dvh;padding:24px}
    aside{width:310px;flex-shrink:0}.logo{font-size:13px;font-weight:900;color:#b45b2e;letter-spacing:.24em}
    h1{font-size:56px;line-height:1.14;color:var(--coral);margin:23px 0 10px;font-weight:900;letter-spacing:-.06em}
    h1 span{display:block;font-size:38px;color:var(--ink);letter-spacing:.02em;margin-top:9px}
    .tagline{font-size:22px;font-weight:800;margin:27px 0 16px}.description{font-size:14px;line-height:1.9;color:var(--quiet)}
    .badge{display:inline-block;padding:9px 15px;background:#fffaf0;border:2px solid #dfb981;border-bottom-width:5px;border-radius:17px;margin:14px 7px 17px 0;font-size:14px;font-weight:750}
    ol{padding-left:23px;font-size:14px;line-height:2.2}small{display:block;color:var(--quiet);font-size:11px;line-height:1.9;margin-top:28px}
    .game-shell{height:calc(100dvh - 48px);aspect-ratio:720/1100;border:4px solid #fffaf0;border-bottom:9px solid #d39b67;border-radius:30px;overflow:hidden;background:var(--cream);box-shadow:0 18px 45px #995b3125;flex-shrink:0}
    iframe{display:block;width:100%;height:100%;border:0;background:var(--cream);touch-action:none}
    @media(max-width:1000px){main{gap:28px}aside{width:250px}h1{font-size:46px}}
    @media(max-width:820px){html,body{overflow:hidden;touch-action:none}main{display:block;padding:0;min-height:0;height:100dvh}aside{display:none}.game-shell{width:100vw;height:100dvh;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}body:before{display:none}}
  </style>
</head>
<body>
<main>
  <aside aria-label="双拼厨房游戏介绍">
    <div class="logo">BENTO POP</div>
    <h1>开饭啦！<span>双拼厨房</span></h1>
    <p class="tagline">一盘两份，三同出餐！</p>
    <p class="description">从早餐餐车到热闹夜市，跟着饭团小厨师，完成一盘盘软乎乎的美味接力。</p>
    <span class="badge">60 个关卡</span><span class="badge">6 家小店</span>
    <ol><li>点选亮色前排，双拼分往两个餐台。</li><li>每台三个相同餐点，自动打包出餐。</li><li>照顾两侧空间，清空餐点即可过关。</li></ol>
    <small>鼠标或触摸操作 · 数字1–6选列 · R重开 · Esc暂停<br>点击开启声音，进度自动保存。<br><br>纯IAA方向试玩 · 广告为模拟 · 无内购<br>前三关帮助免费，随时免费重试。</small>
  </aside>
  <section class="game-shell" aria-label="双拼厨房试玩">
    <iframe src="play.html?v=kitchen-volume-20261117&amp;fit=1" title="开饭啦！双拼厨房" allow="autoplay; fullscreen"></iframe>
  </section>
</main>
</body>
</html>
