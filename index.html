<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1427">
  <meta name="description" content="回声分拣：六章60关双槽解谜，同调、错位与接力渐次展开。前三关无广告，失败可免费重开，在日月回响中收藏180颗星光。">
  <title>回声分拣 · ECHO SORT — 在线试玩</title>
  <style>
    :root { color-scheme:dark; --bg:#0b1427; --ink:#f6f0e2; --quiet:#a4b4c6; --mint:#8be1c5; --brass:#c8aa76; --sun:#f2c777; --moon:#b4b7f2; --line:rgba(200,170,118,.18); }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; }
    body { background:var(--bg); color:var(--ink); font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif; overflow:hidden; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 18% 24%,rgba(163,117,62,.12),transparent 43%),radial-gradient(ellipse at 79% 76%,rgba(111,115,185,.14),transparent 49%),linear-gradient(145deg,transparent 20%,rgba(10,27,44,.58)); }
    body::after { content:""; position:fixed; inset:0; pointer-events:none; opacity:.17; background-image:radial-gradient(#c8aa76 .7px,transparent .7px),radial-gradient(#b4b7f2 .6px,transparent .6px); background-position:0 0,47px 31px; background-size:101px 103px,151px 163px; }
    .studio { position:relative; z-index:1; width:100%; min-height:100dvh; display:flex; justify-content:center; align-items:center; gap:clamp(36px,6vw,96px); padding:24px 40px; }
    .intro { width:320px; flex-shrink:0; display:flex; flex-direction:column; justify-content:center; align-self:stretch; max-height:920px; }
    .brand { display:flex; align-items:center; gap:16px; margin-bottom:clamp(32px,6vh,72px); }
    .brand-mark { position:relative; width:49px; height:49px; flex-shrink:0; border:1px solid #c8aa7659; border-radius:50%; transform:rotate(-18deg); box-shadow:0 0 25px #f2c7770b; }
    .brand-mark::before,.brand-mark::after { content:""; position:absolute; border-radius:50%; }
    .brand-mark::before { width:24px; height:24px; top:5px; left:4px; background:radial-gradient(circle at 30% 25%,#fff3c7,var(--sun) 48%,#ac7740); border:1px solid #f9df9c; box-shadow:0 0 14px #f2c77724; }
    .brand-mark::after { width:26px; height:26px; bottom:4px; right:3px; border:1px solid #cacdf6; background:var(--bg); box-shadow:inset 7px -3px 0 var(--moon); }
    .brand-name { font-size:16px; font-weight:750; line-height:1.1; letter-spacing:.22em; }
    .brand-name span { display:block; color:var(--brass); }
    .eyebrow { display:flex; align-items:center; gap:9px; color:var(--brass); font-size:10px; font-weight:600; letter-spacing:.21em; }
    .eyebrow::before { content:""; width:6px; height:6px; transform:rotate(45deg); background:var(--sun); box-shadow:0 0 16px #f2c77730; }
    h1 { font-size:clamp(34px,3.3vw,48px); font-weight:650; letter-spacing:-.05em; line-height:1.34; margin:20px 0 20px; }
    h1 .soft { color:var(--moon); }
    .description { color:var(--quiet); font-size:14px; line-height:1.9; letter-spacing:.02em; margin:0; max-width:296px; }
    .stats { display:flex; align-items:center; gap:28px; padding:25px 0; margin:5px 0 16px; border-bottom:1px solid var(--line); }
    .stat { display:flex; align-items:baseline; gap:7px; }
    .stat strong { color:var(--sun); font-size:30px; font-weight:500; letter-spacing:-.05em; font-variant-numeric:tabular-nums; }
    .stat:last-child strong { color:var(--moon); }
    .stat span { color:var(--quiet); font-size:11px; }
    .stats .divider { width:1px; height:22px; background:var(--line); }
    .rules { list-style:none; padding:0; margin:0; display:grid; gap:16px; }
    .rules li { display:flex; align-items:center; gap:13px; font-size:12px; color:#c7c9d5; line-height:1.6; }
    .step { display:grid; place-items:center; border:1px solid #c8aa7642; color:var(--sun); background:linear-gradient(145deg,#c8aa7615,#c8aa7603); font-size:10px; font-weight:600; width:28px; height:28px; border-radius:50%; flex-shrink:0; font-variant-numeric:tabular-nums; }
    .rules li:nth-child(2) .step { color:var(--moon); border-color:#b4b7f24d; background:linear-gradient(145deg,#b4b7f217,#b4b7f203); }
    .controls { color:#747c94; font-size:10px; line-height:1.8; margin:24px 0 0; letter-spacing:.02em; }
    kbd { font:inherit; color:#a9afc0; padding:2px 5px; border:1px solid #ffffff13; border-radius:4px; margin-right:3px; }
    .disclosure { margin-top:auto; padding-top:32px; color:#7f889d; font-size:10px; letter-spacing:.04em; line-height:1.8; }
    .disclosure strong { display:block; color:var(--brass); font-size:11px; font-weight:500; margin-bottom:2px; }
    .disclosure strong::before { content:""; display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--brass); margin:0 7px 1px 0; }
    .game-shell { height:calc(100dvh - 48px); aspect-ratio:720 / 1100; flex-shrink:0; border-radius:27px; border:1px solid transparent; overflow:hidden; background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(155deg,#f2c777b3,#c8aa762e 43%,#b4b7f2a6) border-box; box-shadow:0 30px 90px #00000064,-7px -9px 38px #f2c77708,9px 12px 46px #b4b7f20d,0 0 0 6px #c8aa7605; }
    iframe { display:block; border:0; width:100%; height:100%; background:var(--bg); touch-action:none; }
    @media (min-width:821px) and (max-width:1100px) {
      .studio { padding:24px; gap:28px; }
      .intro { width:260px; }
      .game-shell { max-height:calc((100vw - 336px) * 1100 / 720); }
      .description { font-size:13px; }
      .rules li { font-size:11px; }
    }
    @media (max-height:760px) and (min-width:821px) {
      .brand { margin-bottom:24px; }
      h1 { font-size:34px; margin:15px 0; }
      .stats { padding:15px 0; margin:0 0 14px; }
      .rules { gap:10px; }
      .controls { margin-top:16px; }
      .disclosure { padding-top:20px; }
    }
    @media (max-width:820px) {
      html,body { overflow:hidden; touch-action:none; }
      .studio { display:block; min-height:0; height:100dvh; padding:0; }
      .intro { display:none; }
      .game-shell { height:100dvh; width:100vw; aspect-ratio:auto; border:0; border-radius:0; box-shadow:none; }
      body::before,body::after { display:none; }
    }
  </style>
</head>
<body>
  <main class="studio">
    <aside class="intro" aria-label="回声分拣游戏介绍">
      <div class="brand" aria-label="Echo Sort">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-name">ECHO<span>SORT</span></div>
      </div>
      <div class="eyebrow">A LITTLE BALANCE, TWO WORLDS</div>
      <h1>一手，照顾<br><span class="soft">两个世界。</span></h1>
      <p class="description">从晨光花园，走到极光冰原。<br>同调、错位与接力，60关渐次展开。<br>跟着引导轻松上手，再试一个好顺序。</p>
      <div class="stats" aria-label="60关，6个章节">
        <div class="stat"><strong>60</strong><span>个关卡</span></div>
        <div class="divider" aria-hidden="true"></div>
        <div class="stat"><strong>06</strong><span>个主题世界</span></div>
      </div>
      <ol class="rules">
        <li><span class="step">01</span><span>点选前排晶体，日月两面各自入槽。</span></li>
        <li><span class="step">02</span><span>三枚同符号聚合，日月双消触发共鸣。</span></li>
        <li><span class="step">03</span><span>兼顾两侧空间，清空晶体即过关。</span></li>
      </ol>
      <p class="controls"><kbd>1–6</kbd> 选列　<kbd>R</kbd> 重开　<kbd>Esc</kbd> 暂停<br>点击按钮开启声音，音乐与音效可分别调节。</p>
      <div class="disclosure"><strong>IAA 体验演示</strong>前三关无广告 · 随时免费重试<br>广告均为模拟 · 无内购</div>
    </aside>
    <section class="game-shell" aria-label="回声分拣试玩">
      <iframe src="play.html?v=mobile-streaming-20261114" title="回声分拣 — 轻装星际旅程" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </section>
  </main>
</body>
</html>
