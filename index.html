<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff0cd">
  <link rel="icon" href="play.icon.png">
  <meta name="description" content="开饭啦！双拼厨房：一盘两份，三同出餐。六家卡通小店，60关双台接力；免费重试，进度自动保存。">
  <title>开饭啦！双拼厨房 · BENTO POP — 在线试玩</title>
  <style>
    :root{color-scheme:light;--cream:#fff0cd;--ink:#55301f;--quiet:#886249;--coral:#bd3f2b}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}
    body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:var(--cream);color:var(--ink);overflow:hidden}
    body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(90deg,#efb17b18 0 55px,transparent 55px 110px),repeating-linear-gradient(#efb17b18 0 55px,transparent 55px 110px);pointer-events:none}
    main{position:relative;display:flex;justify-content:center;align-items:center;min-height:100dvh;padding:12px}
    .game-shell{height:calc(100dvh - 24px);aspect-ratio:720/1440;border:3px solid #fffaf0;border-bottom:6px solid #d39b67;border-radius:24px;overflow:hidden;background:var(--cream);box-shadow:0 18px 45px #995b3125;flex-shrink:0}
    iframe{display:block;width:100%;height:100%;border:0;background:var(--cream);touch-action:none}
    @media(max-width:820px){html,body{overflow:hidden;touch-action:none}main{display:block;padding:0;min-height:0;height:100dvh}.game-shell{width:100vw;height:100dvh;aspect-ratio:auto;border:0;border-radius:0;box-shadow:none}body:before{display:none}}
  </style>
</head>
<body>
<main>
  <section class="game-shell" aria-label="双拼厨房试玩">
    <iframe src="play.html?v=popup-polish-20261119" title="开饭啦！双拼厨房" allow="autoplay; fullscreen"></iframe>
  </section>
</main>
</body>
</html>
