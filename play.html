<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>开饭啦！双拼厨房 · BENTO POP</title>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="play.icon.png" />
<link rel="apple-touch-icon" href="play.apple-touch-icon.png"/>
<meta name='theme-color' content='#fff0cd'>
  <style>
    :root{color-scheme:light;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#fff0cd;color:#55301f}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none}
    body{background:linear-gradient(180deg,#c5f4ff 0%,#fff9e8 48%,#ffe4b5 100%)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,#fff7de19 0 58px,transparent 58px 116px),repeating-linear-gradient(0deg,#fff5d919 0 2px,transparent 2px 88px)}
    #canvas{display:block;position:absolute;inset:0;margin:auto;width:min(100vw,calc(100dvh * 720 / 1440));height:min(100dvh,calc(100vw * 1440 / 720));outline:none;touch-action:none}
    #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px 26px;background:radial-gradient(ellipse at 50% 42%,#fffdf4 20%,#fff0cd 65%,#bdf2ef 130%);z-index:2}
    .orbit{position:relative;width:120px;height:90px;margin-bottom:30px;border:7px solid #fffdf3;border-radius:25px;background:#fbd39b;box-shadow:0 8px 0 #ce8e52,0 14px 20px #99512c22;transform:rotate(-6deg)}
    .orbit:before,.orbit:after{content:"";position:absolute;border-radius:50%}
    .orbit:before{width:38px;height:38px;left:10px;top:16px;background:linear-gradient(#ffb475,#ed6c4e);box-shadow:0 4px 0 #c54e32,inset 0 3px 0 #ffe0bc}
    .orbit:after{width:38px;height:38px;right:10px;top:16px;background:linear-gradient(#a7e280,#53a344);box-shadow:0 4px 0 #3c8237,inset 0 3px 0 #d6f0a5}
    h1{font-size:32px;font-weight:850;letter-spacing:.03em;margin:0 0 10px;color:#bd3f2b}.tagline{color:#886249;font-size:14px;letter-spacing:.08em;margin:0 0 42px}
    #stage{font-size:16px;margin:0 0 16px}progress{width:min(290px,85%);height:12px;border:0;border-radius:8px;overflow:hidden;background:#efd5aa;accent-color:#ed6c4e}
    progress::-webkit-progress-bar{background:#efd5aa}progress::-webkit-progress-value{background:linear-gradient(90deg,#ffba65,#ed6c4e);border-radius:8px}
    #percent{color:#a65b15;font-size:13px;min-height:20px;margin:12px 0 18px;font-variant-numeric:tabular-nums}
    #hint{font-size:13px;line-height:1.8;color:#886249;max-width:300px;margin:0;min-height:47px}
    #retry{background:linear-gradient(#ff816a,#f24c3d);color:white;border:2px solid #fff6dc;border-radius:22px;padding:13px 32px;margin-top:22px;font:inherit;font-weight:800;box-shadow:0 4px 0 #bd3e2f;cursor:pointer;touch-action:manipulation}
    #retry[hidden]{display:none}.foot{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));font-size:11px;color:#8293a8;letter-spacing:.04em}
    html.test-picker,html.test-picker body{height:auto;min-height:100%;overflow:auto;touch-action:pan-y}
    #test-picker{position:relative;width:min(560px,100%);margin:auto;padding:max(22px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom));}
    #test-picker h1{margin:0 0 6px;font-size:27px}#test-picker p{margin:0 0 14px;color:#75503e}
    .test-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .test-home{display:flex;align-items:center;min-height:44px;color:#653c2a;font-weight:700;white-space:nowrap}
    .test-chapter{padding:12px;margin-top:12px;border:1px solid #edc899;border-radius:18px;background:#fff9ed;box-shadow:0 3px 0 #eac999}
    #test-picker h2{margin:0 0 9px;font-size:15px;color:#55301f}
    .test-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
    .test-grid.shortcuts{grid-template-columns:repeat(3,minmax(0,1fr))}
    .test-level{display:grid;place-items:center;min-height:46px;border-radius:12px;border:1px solid #c79b64;background:#fff2d6;color:#55301f;text-decoration:none;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;touch-action:manipulation}
    .test-level.key{background:#ad3425;color:white;border-color:#89251c}
    .test-level:focus-visible,.test-home:focus-visible{outline:3px solid #146b65;outline-offset:2px}
    .test-stats{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px;font-variant-numeric:tabular-nums;text-align:left}
    .test-stats th,.test-stats td{padding:8px 4px;border-bottom:1px solid #edc899;vertical-align:top;overflow-wrap:anywhere}
    .test-stats thead th{font-size:12px;color:#75503e}.test-stats tbody th{color:#ad3425}
    .test-stats th:first-child{width:13%}.test-stats th:nth-child(2){width:25%}.test-stats th:nth-child(3){width:13%}
    .test-stats small{display:block;color:#75503e;font-size:11px}.test-history{margin:8px 0 0;font-size:13px}
    .test-history summary{cursor:pointer;min-height:44px;padding:12px 0 8px;font-weight:700;color:#653c2a}
    .test-history ul{padding-inline-start:20px;margin:0 0 8px;line-height:1.75}
    #test-picker .test-caption{margin:10px 0 0;font-size:12px}
  </style>
</head>
<body>
  <canvas id="canvas" width="720" height="1440" aria-label="双拼厨房游戏画面">请使用支持网页游戏的浏览器。</canvas>
  <section id="loading" aria-label="游戏加载进度">
    <div class="orbit" aria-hidden="true"></div><h1>开饭啦！</h1>
    <p class="tagline">双拼厨房</p>
    <p id="stage" role="status" aria-live="polite">备餐中</p>
    <progress id="progress" max="100" value="0" aria-label="资源准备进度"></progress>
    <p id="percent">0%</p>
    <p id="hint"></p>
    <button id="retry" hidden type="button">重新加载</button>
  </section>
  <noscript>请开启浏览器 JavaScript 以进入游戏。</noscript>
  <script src="play.js"></script>
  <script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"play","experimentalVK":false,"fileSizes":{"play.wasm":39509339,"play.95d2b4bb210c1384.pck":2877508},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"mainPack":"play.95d2b4bb210c1384.pck"};
// Keep the render buffer at the designed ratio. CSS fits it into the viewport
// over the kitchen backdrop, avoiding engine-generated black letterboxes.
GODOT_CONFIG.canvasResizePolicy = 0;
const GODOT_THREADS_ENABLED = false;
const ECHO_BUILD = 'campaign-stats-20261121';
const params = new URLSearchParams(location.search);
const requestedLevel = params.get('level') || '';
const testMode = params.get('test') === '1';
const testLevel = testMode && /^(?:[1-9]|[1-5][0-9]|60)$/.test(requestedLevel) ? Number(requestedLevel) : 0;
const statPrefix = 'bento:campaign-20261121:stat:';
const toolLabels = {hint_used:'提示', undo_used:'撤回', expand_used:'扩容', rescue_used:'救援'};
let statStorageAvailable = true;

function readTestStats(level) {
  try {
    const saved = JSON.parse(localStorage.getItem(statPrefix + level));
    if (saved && Number.isInteger(saved.wins) && Number.isInteger(saved.fails) && saved.tools && Array.isArray(saved.history)) return saved;
  } catch (error) {
    if (!(error instanceof SyntaxError)) statStorageAvailable = false;
  }
  return {wins:0, fails:0, lastMs:null, bestMs:null, tools:{}, history:[]};
}

function recordTestEvent(entry) {
  const {event, level} = entry;
  if (!Number.isInteger(level) || level < 1 || level > 60) return;
  const stat = readTestStats(level);
  const item = {event, at:entry.timestamp};
  if (event === 'level_win') {
    if (!Number.isFinite(entry.active_ms) || entry.active_ms < 0) return;
    stat.wins++;
    stat.lastMs = entry.active_ms;
    stat.bestMs = stat.bestMs === null ? stat.lastMs : Math.min(stat.bestMs, stat.lastMs);
    item.ms = stat.lastMs;
    item.assists = entry.assists;
  } else if (event === 'level_fail') {
    stat.fails++;
  } else if (Object.prototype.hasOwnProperty.call(toolLabels, event)) {
    stat.tools[event] = (stat.tools[event] || 0) + 1;
    if (event === 'rescue_used') item.steps = entry.steps;
  } else {
    return;
  }
  stat.history = [...stat.history.slice(-11), item];
  try {localStorage.setItem(statPrefix + level, JSON.stringify(stat));}
  catch (error) {statStorageAvailable = false;}
}

function formatTestDuration(ms) {
  const sec = Math.floor(ms / 1000);
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
}

function testStatsTable(levels, stats) {
  const table = document.createElement('table');
  table.className = 'test-stats';
  table.innerHTML = '<thead><tr><th scope="col">关卡</th><th scope="col">通关用时</th><th scope="col">满盘</th><th scope="col">累计道具</th></tr></thead>';
  const body = document.createElement('tbody');
  for (const level of levels) {
    const stat = stats.get(level);
    const row = document.createElement('tr');
    const number = document.createElement('th');
    number.setAttribute('scope', 'row');
    number.textContent = String(level);
    const time = document.createElement('td');
    time.textContent = stat.wins ? formatTestDuration(stat.lastMs) : '—';
    if (stat.wins > 1) {
      const best = document.createElement('small');
      best.textContent = `最快 ${formatTestDuration(stat.bestMs)}`;
      time.append(best);
    }
    const fails = document.createElement('td');
    fails.textContent = String(stat.fails);
    const tools = document.createElement('td');
    tools.textContent = Object.entries(toolLabels).filter(([event]) => stat.tools[event])
      .map(([event, label]) => `${label} ${stat.tools[event]}`).join(' · ') || '—';
    row.append(number, time, fails, tools);
    body.append(row);
  }
  table.append(body);
  return table;
}

function appendTestHistory(container, level, stat) {
  if (!stat.history.length) return;
  const details = document.createElement('details');
  details.className = 'test-history';
  const title = document.createElement('summary');
  title.textContent = `第 ${level} 关 · 最近记录`;
  const list = document.createElement('ul');
  for (const item of [...stat.history].reverse()) {
    const line = document.createElement('li');
    const time = Number.isFinite(item.at) ? new Date(item.at * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
    let text = toolLabels[item.event];
    if (item.event === 'level_win') text = `通关 ${formatTestDuration(item.ms)} · 道具 ${item.assists} 次`;
    if (item.event === 'level_fail') text = '满盘';
    if (item.event === 'rescue_used' && item.steps) text += ` · 回退 ${item.steps} 步`;
    line.textContent = `${time} ${text}`.trim();
    list.append(line);
  }
  details.append(title, list);
  container.append(details);
}

function showTestPicker() {
  document.title = '双拼厨房 · 测试选关';
  document.documentElement.classList.add('test-picker');
  document.getElementById('canvas').style.display = 'none';
  document.getElementById('loading')?.remove();
  document.getElementById('test-picker')?.remove();
  const picker = document.createElement('main');
  picker.id = 'test-picker';
  picker.innerHTML = '<div class="test-head"><h1>测试选关</h1><a class="test-home" href="./">正常试玩</a></div><p>60 关任选，测试进度单独保存。</p>';
  const keyLevels = [43, 59, 60];
  const stats = new Map(Array.from({length:60}, (_, i) => [i + 1, readTestStats(i + 1)]));
  function addGroup(title, levels, shortcuts = false) {
    const section = document.createElement('section');
    section.className = 'test-chapter';
    const header = document.createElement('h2');
    header.textContent = title;
    const grid = document.createElement('div');
    grid.className = shortcuts ? 'test-grid shortcuts' : 'test-grid';
    for (const level of levels) {
      const link = document.createElement('a');
      link.className = keyLevels.includes(level) ? 'test-level key' : 'test-level';
      link.href = `play.html?v=${ECHO_BUILD}&test=1&level=${level}`;
      link.textContent = shortcuts ? `第 ${level} 关` : String(level).padStart(2, '0');
      link.setAttribute('aria-label', `测试第 ${level} 关`);
      grid.append(link);
    }
    section.append(header, grid);
    if (shortcuts) {
      section.append(testStatsTable(levels, stats));
      const caption = document.createElement('p');
      caption.className = 'test-caption';
      caption.textContent = '显示最近通关用时，暂停和广告不计时。满盘与道具按关累计。';
      section.append(caption);
      for (const level of levels) appendTestHistory(section, level, stats.get(level));
    } else {
      const details = document.createElement('details');
      details.className = 'test-history';
      const title = document.createElement('summary');
      title.textContent = '本章记录';
      details.append(title, testStatsTable(levels, stats));
      for (const level of levels) appendTestHistory(details, level, stats.get(level));
      section.append(details);
    }
    picker.append(section);
  }
  addGroup('重点关卡', keyLevels, true);
  for (let chapter = 0; chapter < 6; chapter++) {
    addGroup(`第 ${chapter + 1} 章`, Array.from({length:10}, (_, i) => chapter * 10 + i + 1));
  }
  if (!statStorageAvailable) {
    const notice = document.createElement('p');
    notice.textContent = '当前浏览器无法读取本机测试记录。';
    picker.prepend(notice);
  }
  document.body.append(picker);
}

if (testMode && !testLevel) {
  showTestPicker();
  window.addEventListener('pageshow', event => {if (event.persisted) showTestPicker();});
} else {
  if (testLevel) {
    document.title = `双拼厨房 · 测试第 ${testLevel} 关`;
    GODOT_CONFIG.args = [...GODOT_CONFIG.args, '--', `--campaign-test-level=${testLevel}`];
    window.openCampaignTestPicker = () => location.replace(`play.html?v=${ECHO_BUILD}&test=1`);
    window.recordCampaignPlaytest = recordTestEvent;
  }
  bootGame();
}

function bootGame() {
  const loader = document.getElementById('loading');
  const progress = document.getElementById('progress');
  const percentage = document.getElementById('percent');
  const stage = document.getElementById('stage');
  const hint = document.getElementById('hint');
  const retry = document.getElementById('retry');
  retry.addEventListener('click', () => location.reload());
  let complete = false;
  let lastProgress = performance.now();
  let lastBytes = -1;
  let phase = 'download';
  // Diagnostics stay in memory; no telemetry is sent to a service.
  window.echoBoot = {version:ECHO_BUILD,startedAt:performance.now(),phase:'download',progress:0};
  const slowTimer = setInterval(() => {
    if (complete || document.hidden) return;
    if (performance.now() - lastProgress > 15000) {
      hint.textContent = phase === 'download' ? '网络暂时较慢，请保持页面开启。若长时间没有变化，可重新加载。' : '正在打开场景，首次准备可能需要多等一会儿。';
      retry.hidden = false;
    }
  }, 3000);
  function bootFailure(error) {
    complete = true; clearInterval(slowTimer);
    window.echoBoot.phase = 'failed';
    stage.textContent = '厨房暂时没有准备好';
    hint.textContent = '请检查网络后重试，也可以在手机浏览器中打开此链接。';
    retry.hidden = false;
    console.error('Echo Sort startup failed:', error);
  }
  try {
    const missing = Engine.getMissingFeatures({threads:GODOT_THREADS_ENABLED});
    if (missing.length) {
      bootFailure(new Error(missing.join(', ')));
      hint.textContent = '当前浏览器暂不支持运行游戏，请尝试更新微信或用系统浏览器打开。';
    } else {
      const engine = new Engine(GODOT_CONFIG);
      engine.startGame({onProgress(current,total) {
        if (current !== lastBytes) {lastProgress = performance.now(); lastBytes = current; retry.hidden = true;}
        if (total > 0) {
          const value = Math.max(0, Math.min(100, current / total * 100));
          progress.value = value; percentage.textContent = Math.floor(value) + '%';
          window.echoBoot.progress = value;
          if (current >= total) {
            phase = 'initialize'; stage.textContent = '马上开饭';
            hint.textContent = '餐点已就绪，马上开饭。';
          } else {stage.textContent = '备餐中';}
        } else {progress.removeAttribute('value'); percentage.textContent = '准备中';}
      }}).then(() => {
        complete = true; clearInterval(slowTimer);
        window.echoBoot.phase = 'ready'; window.echoBoot.readyAt = performance.now();
        loader.remove();
      }).catch(bootFailure);
    }
  } catch (error) {bootFailure(error);}
}
  </script>
</body>
</html>
