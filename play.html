<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>回声分拣 · ECHO SORT</title>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="play.icon.png" />
<link rel="apple-touch-icon" href="play.apple-touch-icon.png"/>
<meta name='theme-color' content='#101827'>
  <style>
    :root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#0b1427;color:#f6f0e2}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none}
    #canvas{display:block;width:100%;height:100%;outline:none}
    #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px 26px;background:radial-gradient(ellipse at 50% 36%,#283343,#0b1427 68%);z-index:2}
    .orbit{position:relative;width:120px;height:120px;margin-bottom:30px;border:1px solid #c8aa7666;border-radius:50%;box-shadow:0 0 40px #f2c77713}
    .orbit:before,.orbit:after{content:"";position:absolute;border-radius:50%}
    .orbit:before{width:52px;height:52px;left:15px;top:19px;background:radial-gradient(circle at 30% 25%,#fff3c7,#f2c777 53%,#ac7740);box-shadow:0 0 26px #f2c77733}
    .orbit:after{width:56px;height:56px;right:12px;bottom:14px;background:#17243a;border:1px solid #b4b7f2;box-shadow:inset 15px -7px #b4b7f2}
    h1{font-size:32px;font-weight:600;letter-spacing:.12em;margin:0 0 10px}.tagline{color:#b4b7f2;font-size:14px;letter-spacing:.08em;margin:0 0 42px}
    #stage{font-size:16px;margin:0 0 16px}progress{width:min(290px,85%);height:8px;border:0;border-radius:8px;overflow:hidden;background:#23334a;accent-color:#cce69c}
    progress::-webkit-progress-bar{background:#23334a}progress::-webkit-progress-value{background:linear-gradient(90deg,#f2c777,#cce69c);border-radius:8px}
    #percent{color:#f2c777;font-size:13px;min-height:20px;margin:12px 0 18px;font-variant-numeric:tabular-nums}
    #hint{font-size:13px;line-height:1.8;color:#a4b4c6;max-width:300px;margin:0;min-height:47px}
    #retry{background:#cee6a1;color:#19302a;border:0;border-radius:12px;padding:13px 32px;margin-top:22px;font:inherit;cursor:pointer;touch-action:manipulation}
    #retry[hidden]{display:none}.foot{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));font-size:11px;color:#8293a8;letter-spacing:.04em}
  </style>
</head>
<body>
  <canvas id="canvas" aria-label="回声分拣游戏画面">请使用支持网页游戏的浏览器。</canvas>
  <section id="loading" aria-label="游戏加载进度">
    <div class="orbit" aria-hidden="true"></div><h1>回声分拣</h1>
    <p class="tagline">一枚晶体，照亮日与月。</p>
    <p id="stage" role="status" aria-live="polite">正在准备旅程</p>
    <progress id="progress" max="100" value="0" aria-label="资源准备进度"></progress>
    <p id="percent">0%</p>
    <p id="hint">首次打开需准备游戏资源。<br>后续星域将在进入时加载。</p>
    <button id="retry" hidden type="button">重新加载</button>
    <span class="foot">六处星域 · 六十次恰到好处的相遇</span>
  </section>
  <noscript>请开启浏览器 JavaScript 以进入游戏。</noscript>
  <script src="play.js"></script>
  <script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"play","experimentalVK":false,"fileSizes":{"play.wasm":39509339,"play.7e90549ffe7a81f8.pck":2856456},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"mainPack":"play.7e90549ffe7a81f8.pck"};
const GODOT_THREADS_ENABLED = false;
const ECHO_BUILD = 'mobile-streaming-20261114';
const loader = document.getElementById('loading');
const progress = document.getElementById('progress');
const percentage = document.getElementById('percent');
const stage = document.getElementById('stage');
const hint = document.getElementById('hint');
const retry = document.getElementById('retry');
retry.addEventListener('click', () => location.reload());
let complete = false;
let lastProgress = performance.now();
let lastBytes = -1;
let phase = 'download';
// Diagnostics stay in memory; no telemetry is sent to a service.
window.echoBoot = {version:ECHO_BUILD,startedAt:performance.now(),phase:'download',progress:0};
const slowTimer = setInterval(() => {
  if (complete || document.hidden) return;
  if (performance.now() - lastProgress > 15000) {
    hint.textContent = phase === 'download' ? '网络暂时较慢，请保持页面开启。若长时间没有变化，可重新加载。' : '正在打开场景，首次准备可能需要多等一会儿。';
    retry.hidden = false;
  }
}, 3000);
function bootFailure(error) {
  complete = true; clearInterval(slowTimer);
  window.echoBoot.phase = 'failed';
  stage.textContent = '旅程暂时没有准备好';
  hint.textContent = '请检查网络后重试，也可以在手机浏览器中打开此链接。';
  retry.hidden = false;
  console.error('Echo Sort startup failed:', error);
}
try {
  const missing = Engine.getMissingFeatures({threads:GODOT_THREADS_ENABLED});
  if (missing.length) {
    bootFailure(new Error(missing.join(', ')));
    hint.textContent = '当前浏览器暂不支持运行游戏，请尝试更新微信或用系统浏览器打开。';
  } else {
    const engine = new Engine(GODOT_CONFIG);
    engine.startGame({onProgress(current,total) {
      if (current !== lastBytes) {lastProgress = performance.now(); lastBytes = current; retry.hidden = true;}
      if (total > 0) {
        const value = Math.max(0, Math.min(100, current / total * 100));
        progress.value = value; percentage.textContent = Math.floor(value) + '%';
        window.echoBoot.progress = value;
        if (current >= total) {
          phase = 'initialize'; stage.textContent = '正在点亮晨光花园';
          hint.textContent = '资源已就绪，马上开启旅程。';
        } else {stage.textContent = '正在准备游戏资源';}
      } else {progress.removeAttribute('value'); percentage.textContent = '准备中';}
    }}).then(() => {
      complete = true; clearInterval(slowTimer);
      window.echoBoot.phase = 'ready'; window.echoBoot.readyAt = performance.now();
      loader.remove();
    }).catch(bootFailure);
  }
} catch (error) {bootFailure(error);}
  </script>
</body>
</html>
